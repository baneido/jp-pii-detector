# jp-pii-detector 自身の設定（dogfooding）。
# 検出サンプルを含むファイルを走査から除外する。
min_confidence = "medium"

[allowlist]
paths = [
  "^testdata/",
  "^docs/",
  "^README\\.md$",
  # 公開済みの標準テスト番号・ルール境界サンプルを持つ限定ファイル。
  "^internal/checksum/checksum_test\\.go$",
  "^internal/dict/phone_test\\.go$",
  "^internal/rule/builtin_test\\.go$",
  "^internal/rule/phone_kind_test\\.go$",
  "^internal/detect/(detect|probe_regression|csv_context|health_insurance_6digit|health_insurance_symbol|kun_minutes|title_context|minutes_context)_test\\.go$",
  "^internal/fixturegen/.*_test\\.go$",
  "^cmd/jp-pii-detect/main_test\\.go$",
  "^internal/config/config_test\\.go$",
  "^internal/detect/path_profile_test\\.go$",
  "^internal/dict/(municipalities|postal)_test\\.go$",
  # IPADIC の一般語の一覧（「天竺浪人」の次行の「天竺牡丹」が見出し + 氏名の並びに見える）
  "^internal/dict/common_words\\.txt$",
  "^internal/eval/.*_test\\.go$",
  # Nemotron-PII-Japan 変換器のテスト（架空の氏名・電話番号を含む）
  "^internal/nemotron/.*_test\\.go$",
  "^internal/normalize/normalize_test\\.go$",
  "^internal/report/report_test\\.go$",
  "^internal/rule/structured_test\\.go$",
  "^internal/rule/digit_token_guard_test\\.go$",
  "^internal/source/(encoding|gitdiff)_test\\.go$",
  # モデルの候補行選択のテスト（架空の電話番号・生年月日を含む）
  "^internal/model/prefilter_test\\.go$",
  # 公開 API の位置・互換のテスト（架空の氏名・電話番号・メールアドレスを含む）
  "^pkg/jppii/(span|compat)_test\\.go$",
  # 外部フィクスチャのローカルコピー（実在しうる PII を含む。.gitignore 済みで未コミット）
  "^pii-fixtures\\.json$",
  # Presidio 連携アダプタのサンプル/デモ（架空の PII を含む）
  "^integrations/",
  # モデル同梱ビルドのスモークテスト（架空の PII を含む）
  "^scripts/smoke-model-bundle\\.sh$",
  # 第三者のライセンス表示（原文のまま引用する著作者の実名を含む）
  "^THIRD_PARTY_NOTICES\\.md$",
]
