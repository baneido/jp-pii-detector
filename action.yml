name: jp-pii-detect
description: 日本特化の個人情報（PII）静的検出器をリポジトリに対して実行する
branding:
  icon: shield
  color: red
inputs:
  args:
    description: jp-pii-detect に渡す引数
    required: false
    default: scan --format github .
  version:
    description: インストールするバージョン（GitHub Releases のタグ、または latest）。再現性が必要な場合は明示指定を推奨
    required: false
    default: latest
runs:
  using: composite
  steps:
    - id: install
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        echo "jp-pii-detect version: $INPUT_VERSION"
        install_dir="${RUNNER_TEMP}/jp-pii-detect/bin"
        "$GITHUB_ACTION_PATH/scripts/install.sh" \
          --version "$INPUT_VERSION" \
          --install-dir "$install_dir"
      shell: bash
    - env:
        INPUT_ARGS: ${{ inputs.args }}
      run: |
        # inputs.args はスクリプト本文へ展開せず環境変数経由で受け取る
        # （script injection 対策）。python3 があれば shlex で引用符も含めて
        # 忠実に分割し、無い self-hosted ランナーでは空白分割へフォールバック
        # する（グロブ展開は set -f で無効化。eval しないため $(...) 等の
        # シェル展開は行われない）。
        if command -v python3 >/dev/null 2>&1; then
        python3 - <<'PY'
        import os
        import shlex
        import subprocess

        scanner = os.path.join(os.environ["RUNNER_TEMP"], "jp-pii-detect", "bin", "jp-pii-detect")
        if os.name == "nt":
            scanner += ".exe"

        args = shlex.split(os.environ["INPUT_ARGS"])
        completed = subprocess.run([scanner, *args], check=False)
        raise SystemExit(completed.returncode)
        PY
        else
        scanner="$RUNNER_TEMP/jp-pii-detect/bin/jp-pii-detect"
        set -f
        # shellcheck disable=SC2086 # 空白分割が目的（引用符の解釈はしない）
        set -- $INPUT_ARGS
        set +f
        exec "$scanner" "$@"
        fi
      shell: bash
