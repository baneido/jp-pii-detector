name: accuracy-update

# 評価コーパス（公開データセット Nemotron-PII-Japan の抽出）に対する実測値で、検出精度のゴールデンファイル
# （docs/accuracy.json）・docs/accuracy.md・README.md / README.en.md の精度表記を
# 再生成する。
#
# 背景: 検出挙動を変える PR（例: #148/#149）がマージされると実測値とゴールデンが
# ずれ、ci.yml の corpus-eval ジョブ（main への push ごとに実測とゴールデンの
# 完全一致を検証する）が落ち続ける。手元でも `go run ./cmd/pii-fixture eval -update` で
# 再生成できるが、このワークフローで GitHub 上から workflow_dispatch でワンクリック再生成し、差分があれば postal-update.yml /
# tld-update.yml と同じ方式（作業ブランチへ force-push → PR 作成）で PR を自動作成する。
#
# ci.yml の test job（ゴールデン一致・README バッジ・ドッグフードのゲート）とは
# 完全に独立しており、このワークフローの成否は通常の PR CI に一切影響しない
# （postal-update.yml と同様の分離方針）。
on:
  workflow_dispatch: {}

# 多重実行を避ける（コミット/PR 作成の競合防止）。進行中のランは中断しない。
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# 既定では権限を与えず、必要な job にのみ最小権限を付与する。
permissions: {}

env:
  # PR を載せる作業ブランチ（毎回 force-push して 1 本に集約する）。
  ACCURACY_BRANCH: automated/accuracy-golden

jobs:
  update:
    name: update accuracy golden
    # workflow_dispatch で任意ブランチの workflow を書き込み権限付きで動かせないようにする。
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # 作業ブランチの push に必要
      pull-requests: write # PR の作成・更新に必要
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # 認証情報を作業ツリーに残さない。push は GITHUB_TOKEN を URL に埋めて行う。
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      # 以下、コーパス取得までは ci.yml の corpus-eval ジョブと同一の手順。
      - name: Fetch evaluation corpus (Nemotron-PII-Japan)
        # 公開データセットを fixtures.lock.json の revision と SHA-256 で固定して取得し、
        # 評価ケースの JSON に変換する（cmd/pii-fixture、認証不要）。
        run: |
          set -eu
          dest="$RUNNER_TEMP/eval-corpus.json"
          go run ./cmd/pii-fixture fetch -out "$dest"
          echo "JP_PII_FIXTURES=$dest" >> "$GITHUB_ENV"

      - name: Regenerate accuracy golden
        run: |
          set -eu
          test -f "$JP_PII_FIXTURES" || {
            echo "::error::評価コーパスを取得できませんでした。"
            exit 1
          }
          go test ./internal/eval -timeout 60m -run 'TestGenerateDoc|TestReadmeBadges' -update

      - name: Open PR if the golden changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          if git diff --quiet docs/accuracy.md docs/accuracy.json README.md README.en.md; then
            {
              echo "### golden は最新"
              echo "評価コーパスに対する実測値と \`docs/accuracy.json\` に差分はありませんでした。PR は作成しません。"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "golden は最新。PR は作成しない。"
            exit 0
          fi

          generated_at=$(date -u +'%Y-%m-%d %H:%M UTC')
          today=$(date -u +%Y-%m-%d)
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          title="chore(eval): 検出精度ゴールデンを再生成（${today}）"

          git config user.name "jp-pii-detect-bot"
          git config user.email "contact@baneido.com" # jp-pii-detector:ignore bot の連絡先
          git checkout -b "$ACCURACY_BRANCH"
          # 再生成された精度ドキュメント・ゴールデンファイル・README の精度表記のみを含める。
          git add docs/accuracy.md docs/accuracy.json README.md README.en.md
          git commit -m "$title"
          # 同一リポジトリへの push。認証情報は URL に都度埋め、作業ツリーには残さない。
          git push -f \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:${ACCURACY_BRANCH}"

          # PR 本文は静的テンプレート（コミット済み）に実行時情報を sed で埋め込んで作る。
          body_file=$(mktemp)
          sed \
            -e "s/__GENERATED_AT__/${generated_at}/g" \
            -e "s/__ACTOR__/${GITHUB_ACTOR}/g" \
            -e "s|__RUN_URL__|${run_url}|g" \
            .github/accuracy-pr-body.md > "$body_file"

          # gh pr view <branch> はマージ済み・クローズ済みの PR も返すため、open な PR だけを探す
          open_pr=$(gh pr list --head "$ACCURACY_BRANCH" --base main --state open --json url -q '.[0].url')
          if [ -n "$open_pr" ]; then
            gh pr edit "$open_pr" --title "$title" --body-file "$body_file"
            echo "既存 PR を更新した（${ACCURACY_BRANCH}）。"
            pr_url="$open_pr"
          else
            gh pr create --base main --head "$ACCURACY_BRANCH" \
              --title "$title" --body-file "$body_file"
            echo "PR を作成した（${ACCURACY_BRANCH}）。"
            pr_url=$(gh pr list --head "$ACCURACY_BRANCH" --base main --state open --json url -q '.[0].url')
          fi
          {
            echo "### golden の差分を検出、PR を作成/更新しました"
            echo "${pr_url}"
            echo ""
            echo "マージ前に \`docs/accuracy.md\` の差分を確認してください（実測値が想定外に悪化していないか）。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove evaluation corpus
        if: ${{ always() }}
        run: rm -f "${JP_PII_FIXTURES:-}"
