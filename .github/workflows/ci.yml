name: ci
on:
  push:
    branches: [main]
  pull_request:
  # main上のworkflowから、レビュー済みcommitを保守者が明示評価できる。
  workflow_dispatch:
    inputs:
      eval_ref:
        description: '評価するレビュー済みcommit SHA（40桁）'
        required: true
        type: string

# 同一ブランチ/PR の古い進行中ランを新しいランで置き換え、無駄な実行を避ける
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# workflow 全体では読み取りのみ。
permissions:
  contents: read

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@192e21d79ab29983730a13d1382995c2307fbcaa # v0.5.7
        with:
          # zizmor-action v0.5.7 maps 1.25.2 to a pinned GHCR image digest.
          version: 1.25.2
          inputs: .
          online-audits: false
          advanced-security: false
          annotations: true

  docker:
    name: docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      # release ワークフローが公開するコンテナイメージのビルドが壊れていないことを検証する。
      # CI ではホストアーキテクチャのみビルドする（マルチアーキテクチャは release 側）。
      - name: Build image
        run: docker build -t jp-pii-detect:ci .
      - name: Smoke test
        run: |
          set -eu
          docker run --rm jp-pii-detect:ci version
          # dogfooding: コンテナ経由でも自リポジトリのスキャンが偽陽性ゼロで通ること
          docker run --rm -v "$GITHUB_WORKSPACE:/scan" jp-pii-detect:ci scan --format github /scan

  test:
    name: test
    # 配布対象の macOS でも公開テストレーンを検証する（Homebrew / mise 利用者向け。
    # Windows バイナリは配布のみでサポート外）。
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # 認証情報を作業ツリーに残さない（以降の手順は読み取りのみ）
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      # 公開テストレーンは認証・評価コーパスに依存せず、fork PR でも同じ範囲を実行する。
      - run: go vet ./...
      # --model-dir 用の ORT 推論コード（internal/model の `cgo && ort` タグ付きファイル）は
      # 既定のビルドと配布バイナリ（CGO_ENABLED=0）に含まれず、上の vet でも型検査されない。
      # 壊れたまま気づかないことを防ぐため、タグ付きでも vet する（ORT 本体は実行時に
      # dlopen するので、ここでは共有ライブラリもモデルも不要）。
      - run: go vet -tags ort ./...
        env:
          CGO_ENABLED: "1"
      - run: go test -race ./...
      - run: go build ./cmd/jp-pii-detect
      - run: ./jp-pii-detect scan --format github .

  # Windows でも公開テストレーンを通す（モデル同梱ビルドの windows/amd64 が
  # パスの扱い・実行ファイルの拡張子で落ちていたため）。-race は cgo（gcc）が
  # 必要で Windows ランナーでは遅いので付けない（データ競合は上の test job で見る）。
  test-windows:
    name: test (windows)
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./cmd/jp-pii-detect
      - run: ./jp-pii-detect.exe scan --format github .

  public-eval:
    name: public-eval
    # PR 時の精度ゲート。評価コーパスを使う corpus-eval は PR では走らないため、
    # ソースに PII を持たない決定的な合成コーパス（internal/fixturegen と
    # internal/corpusv2.PublicSynthetic）をルール × プロファイルで評価し、
    # コミット済みゴールデン（internal/publiceval/testdata/golden.json）に対する
    # 再現率の低下・誤検出の増加と、ルール改名に評価ラベルが追従していない不整合で
    # 失敗させる。fork PR でも認証なしで同じ範囲を実行できる（数秒で終わる）。
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: 公開合成コーパスで精度ゲート
        run: go test ./internal/publiceval -count=1 -v
        env:
          # ルール × プロファイルの表と回帰一覧をジョブサマリへ出す（本文は含まない）。
          PUBLIC_EVAL_SUMMARY: ${{ github.step_summary }}

  corpus-eval:
    name: corpus-eval
    # 公開データセット Nemotron-PII-Japan（CC BY 4.0）の抽出 1 万件で、3 プロファイルの実測値が
    # docs/accuracy.json・README の精度表記と完全一致するかを検証する。数分かかるため
    # main への push と保守者の明示実行だけで走らせ、PR 時は public-eval が回帰を見る。
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate explicitly selected commit
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          EVAL_REF: ${{ inputs.eval_ref }}
        run: |
          if ! [[ "$EVAL_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::eval_refには40桁のcommit SHAを指定してください。"
            exit 1
          fi
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.eval_ref || github.sha }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - name: Fetch evaluation corpus (Nemotron-PII-Japan)
        # 公開データセットを fixtures.lock.json の revision と SHA-256 で固定して取得し、
        # 評価ケースの JSON に変換する（cmd/pii-fixture、認証不要）。
        run: |
          set -eu
          dest="$RUNNER_TEMP/eval-corpus.json"
          go run ./cmd/pii-fixture fetch -out "$dest"
          echo "JP_PII_FIXTURES=$dest" >> "$GITHUB_ENV"

      - name: Require and validate evaluation corpus
        run: |
          test -f "$JP_PII_FIXTURES" || {
            echo "::error::評価コーパスを取得できませんでした。"
            exit 1
          }
          go test -timeout 60m ./internal/privatecorpus ./internal/eval
      - run: |
          go test ./internal/eval -timeout 60m -run 'TestGenerateDoc|TestReadmeBadges' -update
          git diff --exit-code docs/accuracy.md docs/accuracy.json README.md README.en.md
      - name: Remove evaluation corpus
        if: ${{ always() }}
        run: rm -f "${JP_PII_FIXTURES:-}"
